# Local development database for mypet.az + vet.mypet.az.
# Mirrors the production VPS Postgres (PLAN.md §3). Bring up with `pnpm db:up`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mypet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mypet
      POSTGRES_PASSWORD: mypet
      POSTGRES_DB: mypet
    ports:
      - '5432:5432'
    volumes:
      - mypet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mypet -d mypet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mypet-pgdata:
